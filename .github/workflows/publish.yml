name: Publish packages

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        description: Dry-Run
      prerelease:
        type: boolean
        description: Force prerelease
      graduate:
        type: boolean
        description: Force Conventional Graduate
      publish_only:
        type: boolean
        description: "Skip running `lerna version` and run publish-only retry (useful to retry failed publish)"

# Keep the workflow token read-only by default; elevated permissions are granted per job. GitHub
# Actions has no step-level permissions, so the single release job necessarily runs install/build
# with its job permissions (`contents: write` for lerna tagging, `id-token: write` for npm
# provenance / trusted publishing). The release job is gated by the `npm-publish` environment.
permissions:
  contents: read

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    # Gate every release behind a manually configured GitHub environment (required reviewers,
    # deployment branch policy). The environment is created on first use, so maintainers can add
    # protection rules without touching this file.
    environment: npm-publish
    # Never let two releases race on tags; a queued run waits instead of cancelling the first one.
    concurrency:
      group: publish
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check if user is allowed to push new release
        if: ${{ github.actor != 'Mister-Hope' }}
        run: |
          echo "You are not allowed to push new release."
          exit 1

      - name: Ensure publish-only retries run from main
        if: ${{ inputs.publish_only == true && inputs.dryrun != true && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::publish_only skips 'lerna version', the only step that enforces the 'allowBranch: main' rule, and publishes whatever was built from the dispatched ref. Dispatch it from the main branch (a dry run is still allowed anywhere)."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^24.22.1
          # Fail when the lockfile is missing/out of date; installs with --frozen-lockfile.
          require-lockfile: true

      # `pnpm run build` copies the shared enhance files into skyline-enhance. Hand edits in
      # skyline-enhance are silently overwritten there, so fail before building when the committed
      # copies are already out of sync (same gate as test.yml).
      - name: Check enhance → skyline-enhance sync
        run: pnpm run sync:check

      - name: Build project
        run: pnpm run build

      # The build must not rewrite tracked files; otherwise the published tree differs from the commit.
      - name: Ensure build left tracked files untouched
        run: git diff --exit-code

      - name: Linting check
        run: pnpm lint:check

      - name: Type check
        run: pnpm typecheck

      - name: Test check
        run: pnpm test

      - name: Config git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Lerna Version${{ inputs.dryrun == true && ' with dry run' || '' }}
        if: ${{ inputs.publish_only != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec lerna version ${{ inputs.dryrun == true && '--dry-run' || '' }} ${{ inputs.graduate == true && '--conventional-graduate' || inputs.prerelease == true && '--conventional-prerelease' || '' }} --yes

      - name: Publish packages${{ inputs.dryrun == true && ' with dry run' || '' }}
        run: |
          pnpm exec lerna publish from-package --force-publish --yes${{ inputs.dryrun == true && ' --dry-run' || '' }}

      - name: Sync npmmirror
        if: ${{ inputs.dryrun != true }}
        run: pnpm exec unrun scripts/sync.ts
