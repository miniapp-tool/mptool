name: Generate and deploy docs

on:
  workflow_call:
    secrets:
      MEILISEARCH_MASTER_KEY:
        required: true

  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    name: re-scrape documentation for MeiliSearch
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run scraper
        env:
          # replace with your own MeiliSearch host URL
          HOST_URL: https://meilisearch.mister-hope.com
          API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}
          # replace it with the path to your config file
          CONFIG_FILE_PATH: ${{ github.workspace }}/docs/scraper.json
        run: |
          # Pin the image by digest (multi-arch index of `:latest`, last pushed 2023-08-03) so a
          # compromised/regressed upstream tag cannot change what runs with the API key.
          docker run -t --rm \
            -e MEILISEARCH_HOST_URL=$HOST_URL \
            -e MEILISEARCH_API_KEY=$API_KEY \
            -v $CONFIG_FILE_PATH:/docs-scraper/config.json \
            getmeili/docs-scraper@sha256:1de9f33272d53ed5ddcb9890bb0454d8ff227de76cd2c87e3d1bb84810e4e516 \
            pipenv run ./docs_scraper config.json
