name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  # Used by the Codecov bundler plugin, which requests a GitHub OIDC token while `pnpm run build`
  # runs (`BUNDLE_ANALYSIS=true`). GitHub Actions only supports workflow/job-level permissions, so
  # this cannot be narrowed to the build step; no step requests a token during install.
  # 仅构建步骤中的 Codecov 插件会请求 OIDC token；GitHub Actions 不支持步骤级权限，故只能在 job 级声明。
  id-token: write

jobs:
  linter-and-unit:
    name: Linter and Unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PRs supersede their previous run; pushes to main must never cancel or replace each other,
    # otherwise a fast merge sequence leaves older main commits with a cancelled/red run. Each main
    # push gets its own group (keyed by SHA) and never cancels an in-progress run.
    concurrency:
      group: test-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^24.22.1
          # Fail when the lockfile is missing/out of date; installs with --frozen-lockfile.
          require-lockfile: true

      # `pnpm run build` copies the shared enhance files into skyline-enhance. Hand edits in
      # skyline-enhance are silently overwritten there, so fail before building when the committed
      # copies are already out of sync.
      - name: Check enhance → skyline-enhance sync
        run: pnpm run sync:check

      - name: Build project
        env:
          BUNDLE_ANALYSIS: true
        run: pnpm run build

      # The build must not rewrite tracked files; otherwise the tested tree differs from the commit.
      - name: Ensure build left tracked files untouched
        run: git diff --exit-code

      - name: Linter check
        run: pnpm run lint:check

      - name: Type check
        run: pnpm run typecheck

      - name: Unit test
        run: pnpm run test

      - name: Upload coverage
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: codecov/test-results-action@v1
        with:
          file: ./coverage/test-report.junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
