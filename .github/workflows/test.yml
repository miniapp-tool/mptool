name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  # used by the Codecov bundler plugin (OIDC bundle analysis upload)
  id-token: write

jobs:
  linter-and-unit:
    name: Linter and Unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^24.22.1

      - name: Install deps
        run: pnpm ci

      # `pnpm run build` copies the shared enhance files into skyline-enhance. Hand edits in
      # skyline-enhance are silently overwritten there, so fail before building when the committed
      # copies are already out of sync.
      - name: Check enhance → skyline-enhance sync
        run: pnpm run sync:check

      - name: Build project
        env:
          BUNDLE_ANALYSIS: true
        run: pnpm run build

      # The build must not rewrite tracked files; otherwise the tested tree differs from the commit.
      - name: Ensure build left tracked files untouched
        run: git diff --exit-code

      - name: Linter check
        run: pnpm run lint:check

      - name: Type check
        run: pnpm run typecheck

      - name: Unit test
        run: pnpm run test

      - name: Upload coverage
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: codecov/test-results-action@v1
        with:
          file: ./coverage/test-report.junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
