packages:
  - demo/
  - docs/
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  esbuild: true

enableGlobalVirtualStore: true

minimumReleaseAgeExclude:
  - "@mdit/*"
  - "@oxfmt/*"
  - "@oxlint/*"
  - "@vuepress/*"
  - oxc-config-hope
  - oxfmt
  - oxlint
  - vuepress
  - vuepress-*

packageExtensions:
  "@lerna-lite/version":
    peerDependencies:
      conventional-changelog-conventionalcommits: ^10.2.0
